<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo:start-->
    <title>Nandu K V</title>
    <!--seo:end-->
    <meta name="author" content="Nandu K V" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0b0d" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'light' ? '#f1eee6' : '#0a0b0d')
      })()
    </script>
    <!--jsonld-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Nandu K V — Senior UX/UI Developer (React.js). This portfolio needs JavaScript to run. Contact:
        nandukv96@gmail.com
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
